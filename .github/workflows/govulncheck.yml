---
name: Check for Vulnerabilities

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  check-for-vulnerabilities:
    name: Check for Vulnerabilities
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Run govulncheck and save to file
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest -format sarif ./... > govulncheck.sarif
          jq '.runs[].results = ([.runs[].results[] | select(.level != "note")])' govulncheck.sarif > govulncheck.sarif.no-notes
          mv govulncheck.sarif.no-notes govulncheck.sarif
        env:
          GOEXPERIMENT: jsonv2

      - name: Upload SARIF File
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
