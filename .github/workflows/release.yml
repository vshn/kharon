name: Release

permissions:
  contents: write # For creating releases and uploading artifacts
  pull-requests: read # For building changelog from PRs with labels

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-26
            target: darwin-aarch64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'

      - name: Run build
        run: make build

      - name: Upload builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kharon-${{ matrix.platform.target }}
          path: kharon

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Download builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Rename files for publishing
        run: |
          mkdir -p dist
          ls -R artifacts
          cd artifacts

          for file in kharon-*/kharon; do
              target=$(dirname "$file")
              mv "$file" "../dist/${target}"
          done

      - name: Checksums
        run: |
          cd dist

          sha256sum kharon-* > checksums.txt
          cat checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checksums
          path: dist/checksums.txt

      - name: Build changelog from PRs with labels
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@348e88fab4c37338b1e803ceb2d4a7a5db6c0833 # v6
        with:
          configuration: ".github/changelog-configuration.json"
          # PreReleases still get a changelog, but the next full release gets a diff since the last full release,
          # combining possible changelogs of all previous PreReleases in between.
          # PreReleases show a partial changelog since last PreRelease.
          # It is assumed that PreReleases have a '-' in their tag name, e.g. 'v1.0.0-alpha.1'.
          # `github.ref` is in the format of 'refs/tags/v1.0.0-alpha.1' for tags.
          ignorePreReleases: "${{ !contains(github.ref, '-') }}"
          outputFile: .github/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          body: ${{steps.build_changelog.outputs.changelog}}
          # It is assumed that PreReleases have a '-' in their tag name, e.g. 'v1.0.0-alpha.1'.
          # `github.ref` is in the format of 'refs/tags/v1.0.0-alpha.1' for tags.
          prerelease: "${{ contains(github.ref, '-') }}"
          commit: main
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: dist/*

  bump-pkgbuild:
    needs: publish
    # Skip PreReleases (tags containing '-', e.g. 'v1.0.0-alpha.1').
    if: ${{ !contains(github.ref, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          ssh-key: ${{ secrets.BUMP_PKGBUILD_DEPLOY_KEY }}

      - name: Bump PKGBUILD pkgver
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=${version}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          commit_message: "Bump PKGBUILD to ${{ github.ref_name }}"
          file_pattern: PKGBUILD

  bump-cask:
    needs: publish
    # Skip PreReleases (tags containing '-', e.g. 'v1.0.0-alpha.1').
    # if: ${{ !contains(github.ref, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: 'vshn/homebrew-tap'
          ssh-key: ${{ secrets.VSHN_HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap
          ref: testing

      - name: Download checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: checksums

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Update Cask version and checksums
        run: |
          ls -l
          go run ./hack/homebrew "${{ github.ref_name }}" checksums.txt > homebrew-tap/Casks/kharon.rb

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          commit_message: "Kharon Cask update to ${{ github.ref_name }}"
          repository: homebrew-tap
          file_pattern: Casks/kharon.rb
