name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  go:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: macos-26
            target: darwin-aarch64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Run build
        run: make build
